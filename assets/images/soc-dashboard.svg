<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="socBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071C33"/>
      <stop offset="100%" stop-color="#020B19"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#087DFF" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087DFF"/>
      <stop offset="100%" stop-color="#00BFFF"/>
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect width="600" height="450" rx="14" fill="url(#socBg)" stroke="rgba(0, 191, 255, 0.25)" stroke-width="1.5"/>

  <!-- Window Top Bar -->
  <rect width="600" height="42" rx="14" fill="#041224"/>
  <rect y="38" width="600" height="4" fill="#041224"/>
  <circle cx="24" cy="21" r="5" fill="#FF5F56"/>
  <circle cx="42" cy="21" r="5" fill="#FFBD2E"/>
  <circle cx="60" cy="21" r="5" fill="#27C93F"/>
  <text x="300" y="25" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#A8B8CC" text-anchor="middle" letter-spacing="0.5">INFRONIXX SEC-OPS &bull; Threat Intelligence &amp; Telemetry</text>

  <!-- Left Column: Threat Monitor Panel -->
  <g transform="translate(24, 60)">
    <rect width="260" height="170" rx="10" fill="#06162B" stroke="rgba(0, 191, 255, 0.15)" stroke-width="1"/>
    <text x="16" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#00BFFF" letter-spacing="0.5">NETWORK TRAFFIC ANALYSIS</text>
    
    <!-- Area Chart -->
    <path d="M 20 135 Q 60 90 100 110 T 170 70 T 240 85 L 240 145 L 20 145 Z" fill="url(#chartGrad)"/>
    <path d="M 20 135 Q 60 90 100 110 T 170 70 T 240 85" stroke="#00BFFF" stroke-width="2.5" fill="none"/>
    <circle cx="170" cy="70" r="4" fill="#FFFFFF" stroke="#00BFFF" stroke-width="2"/>

    <!-- Grid lines -->
    <line x1="20" y1="50" x2="240" y2="50" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    <line x1="20" y1="90" x2="240" y2="90" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    <line x1="20" y1="130" x2="240" y2="130" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>

    <text x="20" y="158" font-family="'Inter', sans-serif" font-size="9" fill="#738A9C">REAL-TIME PACKET FLOW &bull; ANOMALY FREE</text>
  </g>

  <!-- Right Column: Defense Status -->
  <g transform="translate(308, 60)">
    <rect width="268" height="170" rx="10" fill="#06162B" stroke="rgba(0, 191, 255, 0.15)" stroke-width="1"/>
    <text x="16" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#00BFFF" letter-spacing="0.5">SECURITY CONTROLS STATUS</text>

    <!-- Progress 1 -->
    <text x="16" y="55" font-family="'Inter', sans-serif" font-size="11" fill="#F5F8FC">Endpoint Protection Layer</text>
    <text x="250" y="55" font-family="'Inter', sans-serif" font-size="10" fill="#00BFFF" text-anchor="end">Hardened</text>
    <rect x="16" y="62" width="234" height="6" rx="3" fill="rgba(255, 255, 255, 0.1)"/>
    <rect x="16" y="62" width="220" height="6" rx="3" fill="url(#barGrad)"/>

    <!-- Progress 2 -->
    <text x="16" y="95" font-family="'Inter', sans-serif" font-size="11" fill="#F5F8FC">Cloud Infrastructure Posture</text>
    <text x="250" y="95" font-family="'Inter', sans-serif" font-size="10" fill="#00BFFF" text-anchor="end">Monitored</text>
    <rect x="16" y="102" width="234" height="6" rx="3" fill="rgba(255, 255, 255, 0.1)"/>
    <rect x="16" y="102" width="210" height="6" rx="3" fill="url(#barGrad)"/>

    <!-- Progress 3 -->
    <text x="16" y="135" font-family="'Inter', sans-serif" font-size="11" fill="#F5F8FC">Vulnerability Surface Scan</text>
    <text x="250" y="135" font-family="'Inter', sans-serif" font-size="10" fill="#00BFFF" text-anchor="end">Remediated</text>
    <rect x="16" y="142" width="234" height="6" rx="3" fill="rgba(255, 255, 255, 0.1)"/>
    <rect x="16" y="142" width="230" height="6" rx="3" fill="url(#barGrad)"/>
  </g>

  <!-- Bottom Panel: Event Stream & Architecture Health -->
  <g transform="translate(24, 250)">
    <rect width="552" height="175" rx="10" fill="#06162B" stroke="rgba(0, 191, 255, 0.15)" stroke-width="1"/>
    <text x="20" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#00BFFF" letter-spacing="0.5">SECURITY TELEMETRY LOGS &amp; GOVERNANCE</text>
    
    <!-- Row 1 -->
    <g transform="translate(20, 42)">
      <rect width="512" height="34" rx="6" fill="#041224" stroke="rgba(0, 191, 255, 0.1)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#00E5FF"/>
      <text x="32" y="21" font-family="'Courier New', monospace" font-size="11" fill="#F5F8FC">[OK] Firewall Perimeter: Dynamic packet filtering operational</text>
      <text x="495" y="21" font-family="'Inter', sans-serif" font-size="10" fill="#738A9C" text-anchor="end">LIVE</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(20, 84)">
      <rect width="512" height="34" rx="6" fill="#041224" stroke="rgba(0, 191, 255, 0.1)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#00BFFF"/>
      <text x="32" y="21" font-family="'Courier New', monospace" font-size="11" fill="#F5F8FC">[OK] IAM Access: MFA token verification enforced across cloud tenant</text>
      <text x="495" y="21" font-family="'Inter', sans-serif" font-size="10" fill="#738A9C" text-anchor="end">SYNCED</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(20, 126)">
      <rect width="512" height="34" rx="6" fill="#041224" stroke="rgba(0, 191, 255, 0.1)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#087DFF"/>
      <text x="32" y="21" font-family="'Courier New', monospace" font-size="11" fill="#F5F8FC">[OK] Data Safeguards: AES-256 at-rest volume encryption validated</text>
      <text x="495" y="21" font-family="'Inter', sans-serif" font-size="10" fill="#738A9C" text-anchor="end">PASS</text>
    </g>
  </g>
</svg>

