<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vaptBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071C33"/>
      <stop offset="100%" stop-color="#020B19"/>
    </linearGradient>
    <radialGradient id="targetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00BFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#020B19" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="420" rx="14" fill="url(#vaptBg)" stroke="rgba(0, 191, 255, 0.2)" stroke-width="1.5"/>

  <!-- Radar Cones -->
  <circle cx="300" cy="210" r="160" stroke="rgba(0, 191, 255, 0.12)" stroke-width="1"/>
  <circle cx="300" cy="210" r="110" stroke="rgba(0, 191, 255, 0.18)" stroke-width="1"/>
  <circle cx="300" cy="210" r="60" stroke="rgba(0, 191, 255, 0.25)" stroke-width="1.5"/>
  <circle cx="300" cy="210" r="180" fill="url(#targetGlow)"/>

  <!-- Crosshairs -->
  <line x1="300" y1="30" x2="300" y2="390" stroke="rgba(0, 191, 255, 0.15)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="100" y1="210" x2="500" y2="210" stroke="rgba(0, 191, 255, 0.15)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Central Fortified Core -->
  <g transform="translate(260, 170)">
    <rect width="80" height="80" rx="12" fill="#06162B" stroke="#00BFFF" stroke-width="2"/>
    <!-- Central Shield -->
    <path d="M 300 195 L 315 202 V 215 C 315 224 300 230 300 230 C 300 230 285 224 285 215 V 202 Z" 
          transform="translate(-260, -170)" fill="#087DFF" stroke="#00BFFF" stroke-width="1.5"/>
    <text x="40" y="65" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#F5F8FC" text-anchor="middle">CORE ASSET</text>
  </g>

  <!-- Network Nodes with Target Reticles -->
  <!-- Node 1: Cloud Tenant -->
  <g transform="translate(100, 80)">
    <rect width="130" height="60" rx="8" fill="#041224" stroke="rgba(0, 191, 255, 0.3)" stroke-width="1"/>
    <circle cx="25" cy="30" r="12" fill="rgba(0, 191, 255, 0.15)"/>
    <text x="25" y="34" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#00BFFF" text-anchor="middle">AWS</text>
    <text x="48" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#F5F8FC">Cloud Tenant</text>
    <text x="48" y="42" font-family="'Inter', sans-serif" font-size="8.5" fill="#00E5FF">Posture Tested</text>
    <path d="M 130 30 L 260 170" stroke="rgba(0, 191, 255, 0.4)" stroke-width="1.5" stroke-dasharray="4 2"/>
  </g>

  <!-- Node 2: Web API & Application -->
  <g transform="translate(370, 75)">
    <rect width="135" height="60" rx="8" fill="#041224" stroke="rgba(0, 191, 255, 0.3)" stroke-width="1"/>
    <circle cx="25" cy="30" r="12" fill="rgba(8, 125, 255, 0.2)"/>
    <text x="25" y="34" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#087DFF" text-anchor="middle">API</text>
    <text x="48" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#F5F8FC">App Endpoint</text>
    <text x="48" y="42" font-family="'Inter', sans-serif" font-size="8.5" fill="#00BFFF">OWASP Scanned</text>
    <path d="M 370 30 L 340 170" stroke="rgba(0, 191, 255, 0.4)" stroke-width="1.5" stroke-dasharray="4 2"/>
  </g>

  <!-- Node 3: On-Prem Server / Active Directory -->
  <g transform="translate(90, 275)">
    <rect width="140" height="60" rx="8" fill="#041224" stroke="rgba(0, 191, 255, 0.3)" stroke-width="1"/>
    <circle cx="25" cy="30" r="12" fill="rgba(0, 191, 255, 0.15)"/>
    <text x="25" y="34" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#00BFFF" text-anchor="middle">LAN</text>
    <text x="48" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#F5F8FC">Network Infra</text>
    <text x="48" y="42" font-family="'Inter', sans-serif" font-size="8.5" fill="#00E5FF">VAPT Assessed</text>
    <path d="M 130 275 L 260 250" stroke="rgba(0, 191, 255, 0.4)" stroke-width="1.5" stroke-dasharray="4 2"/>
  </g>

  <!-- Node 4: Endpoint Fleet & Workstations -->
  <g transform="translate(370, 280)">
    <rect width="135" height="60" rx="8" fill="#041224" stroke="rgba(0, 191, 255, 0.3)" stroke-width="1"/>
    <circle cx="25" cy="30" r="12" fill="rgba(8, 125, 255, 0.2)"/>
    <text x="25" y="34" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#087DFF" text-anchor="middle">EDR</text>
    <text x="48" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#F5F8FC">Endpoint Fleet</text>
    <text x="48" y="42" font-family="'Inter', sans-serif" font-size="8.5" fill="#00BFFF">Zero-Day Shield</text>
    <path d="M 370 280 L 340 250" stroke="rgba(0, 191, 255, 0.4)" stroke-width="1.5" stroke-dasharray="4 2"/>
  </g>

  <!-- Top status tag -->
  <rect x="200" y="15" width="200" height="26" rx="13" fill="#06162B" stroke="#00BFFF" stroke-width="1"/>
  <text x="300" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#00BFFF" text-anchor="middle" letter-spacing="1">SURFACE VULNERABILITY MAP</text>
</svg>

