<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#087DFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#020B19" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#087DFF" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00BFFF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#087DFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020B19" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 191, 255, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Grid & Glow -->
  <rect width="600" height="500" rx="16" fill="#041224" />
  <rect width="600" height="500" rx="16" fill="url(#cyberGrid)" />
  <circle cx="300" cy="240" r="180" fill="url(#centerGlow)"/>

  <!-- Orbital Rings -->
  <circle cx="300" cy="240" r="210" stroke="rgba(0, 191, 255, 0.15)" stroke-width="1" stroke-dasharray="4 8"/>
  <circle cx="300" cy="240" r="160" stroke="rgba(8, 125, 255, 0.25)" stroke-width="1.5" stroke-dasharray="12 16"/>
  <ellipse cx="300" cy="240" rx="230" ry="80" stroke="rgba(0, 191, 255, 0.2)" stroke-width="1.5" transform="rotate(-25 300 240)"/>

  <!-- Floating Data Nodes / Hexagons -->
  <g stroke="#00BFFF" stroke-width="1.2" fill="#071C33" opacity="0.85">
    <polygon points="120,110 135,102 150,110 150,128 135,136 120,128" />
    <circle cx="135" cy="119" r="3" fill="#00BFFF"/>
    
    <polygon points="460,130 475,122 490,130 490,148 475,156 460,148" />
    <circle cx="475" cy="139" r="3" fill="#00BFFF"/>

    <polygon points="470,360 485,352 500,360 500,378 485,386 470,378" />
    <circle cx="485" cy="369" r="3" fill="#087DFF"/>

    <polygon points="110,370 125,362 140,370 140,388 125,396 110,388" />
    <circle cx="125" cy="379" r="3" fill="#00BFFF"/>
  </g>

  <!-- Network Connection Vectors -->
  <path d="M 150 119 L 240 180 M 460 139 L 360 180 M 140 379 L 240 310 M 470 369 L 360 310" stroke="rgba(0, 191, 255, 0.3)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Outer Cyber Shield Base -->
  <path d="M 300 70 L 410 120 V 230 C 410 320 300 395 300 395 C 300 395 190 320 190 230 V 120 Z" 
        fill="#071C33" stroke="rgba(0, 191, 255, 0.4)" stroke-width="2"/>

  <!-- Inner Shaded Shield with Gradient -->
  <path d="M 300 88 L 392 132 V 226 C 392 304 300 370 300 370 C 300 370 208 304 208 226 V 132 Z" 
        fill="url(#shieldGrad)" stroke="#00BFFF" stroke-width="1.5" opacity="0.85"/>

  <!-- Shield Core Highlights -->
  <path d="M 300 100 V 355 C 300 355 375 295 375 226 V 140 L 300 100 Z" 
        fill="rgba(255, 255, 255, 0.08)"/>

  <!-- High-Tech Central Padlock Symbol -->
  <g filter="url(#glow)">
    <!-- Lock Shackle -->
    <path d="M 275 200 V 175 C 275 161 286 150 300 150 C 314 150 325 161 325 175 V 200" 
          stroke="#F5F8FC" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Lock Body -->
    <rect x="262" y="200" width="76" height="60" rx="8" fill="#071C33" stroke="#00BFFF" stroke-width="2.5"/>
    <!-- Keyhole -->
    <circle cx="300" cy="225" r="7" fill="#00BFFF"/>
    <polygon points="297,225 303,225 305,242 295,242" fill="#00BFFF"/>
  </g>

  <!-- Scanning Laser Bar -->
  <line x1="215" y1="230" x2="385" y2="230" stroke="#00BFFF" stroke-width="2" opacity="0.8" filter="url(#glow)"/>
  <circle cx="300" cy="230" r="4" fill="#FFFFFF"/>

  <!-- Security Status Badges on the Graphic -->
  <g transform="translate(60, 420)">
    <rect width="140" height="36" rx="18" fill="#06162B" stroke="rgba(0, 191, 255, 0.3)" stroke-width="1"/>
    <circle cx="18" cy="18" r="5" fill="#00E5FF"/>
    <text x="32" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#F5F8FC" letter-spacing="0.5">ZERO TRUST ACTIVE</text>
  </g>

  <g transform="translate(390, 420)">
    <rect width="150" height="36" rx="18" fill="#06162B" stroke="rgba(8, 125, 255, 0.4)" stroke-width="1"/>
    <circle cx="18" cy="18" r="5" fill="#087DFF"/>
    <text x="32" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#F5F8FC" letter-spacing="0.5">ENCRYPTION 256-BIT</text>
  </g>

  <g transform="translate(230, 25)">
    <rect width="140" height="30" rx="6" fill="#071C33" stroke="rgba(0, 191, 255, 0.25)" stroke-width="1"/>
    <text x="70" y="19" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#00BFFF" text-anchor="middle" letter-spacing="1">DEFENSE IN DEPTH</text>
  </g>
</svg>

